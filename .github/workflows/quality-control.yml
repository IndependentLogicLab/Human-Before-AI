name: Human Before AI - Historical Quality Control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-quality-control
  cancel-in-progress: false

jobs:
  quality-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run software tests
        run: |
          python -m unittest discover -s scripts -p "test_*.py" -v
          python -m compileall scripts

      - name: Verify original document
        run: |
          test -f data/originals/farmmechanicsmac00shearich.pdf
          sha256sum data/originals/farmmechanicsmac00shearich.pdf

      - name: Inspect historical document
        run: |
          python scripts/quality_control.py \
            data/originals/farmmechanicsmac00shearich.pdf \
            AGR-0001 \
            --first-page 13 \
            --last-page 244

      - name: Display quality report
        run: |
          ls -lh data/quality/
          cat data/quality/AGR-0001_report.json

      - name: Upload quality control results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-quality-control
          path: data/quality/
          retention-days: 7
          if-no-files-found: warn
