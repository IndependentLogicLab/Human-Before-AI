name: Human Before AI - Extract Historical PDF

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-pdf-extraction
  cancel-in-progress: false

jobs:
  extract-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run software tests
        run: |
          python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Verify original PDF
        run: |
          test -f data/originals/farmmechanicsmac00shearich.pdf
          pdfinfo data/originals/farmmechanicsmac00shearich.pdf
          sha256sum data/originals/farmmechanicsmac00shearich.pdf

      - name: Extract historical text
        run: |
          python scripts/extract_pdf.py \
            data/originals/farmmechanicsmac00shearich.pdf \
            AGR-0001 \
            --first-page 13 \
            --last-page 244

      - name: Display extraction results
        run: |
          echo "Extracted files:"
          ls -lh data/extracted/
          echo "Review files:"
          ls -lh data/review/
          echo "Document metadata:"
          cat data/review/AGR-0001.json

      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-pdf-extraction
          path: |
            data/extracted/
            data/review/
          retention-days: 7
          if-no-files-found: warn
